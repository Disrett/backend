# Secrets de l'API (DATABASE_URL + secrets JWT). ⚠️ Valeurs de TEST.
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: sans-limite
type: Opaque
stringData:
  # Le host "postgres" = nom du Service ; résolu par le DNS interne du cluster
  DATABASE_URL: "postgresql://sl_user:sl_password_test@postgres:5432/sans_limite?schema=public"
  JWT_ACCESS_SECRET: "test-access-secret-a-remplacer"
  JWT_ACCESS_EXPIRES_IN: "15m"
  JWT_REFRESH_SECRET: "test-refresh-secret-a-remplacer"
  JWT_REFRESH_EXPIRES_IN: "7d"
  FRONTEND_URL: "http://localhost:3000,http://192.168.1.21:3000"
  PORT: "3001"
